[project]
name = "powernse"
version = "0.7.0"
description = "Download and use NSE India end-of-day equity archives via CLI and Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Vishal Mishra", email = "vishal.k.mishra2@gmail.com" },
]
keywords = ["nse", "india", "bhavcopy", "equities", "market-data", "download"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
requires-python = ">=3.13"
dependencies = [
    "exchange-calendars>=4.5",
    "filelock>=3.32",
    "numpy>=2.1",
    "pandas>=2.2",
    "pdschema>=0.2.1",
    "pyarrow>=17",
    "pydantic>=2.10",
    "pydantic-settings>=2.15",
    "requests>=2.32",
    "tenacity>=9.0",
    "typer>=0.27",
]

[project.scripts]
powernse = "powernse.cli:main"

[project.urls]
Homepage = "https://inquilabee.github.io/powernse/"
Documentation = "https://inquilabee.github.io/powernse/"
Repository = "https://github.com/inquilabee/powernse"
Issues = "https://github.com/inquilabee/powernse/issues"
Changelog = "https://github.com/inquilabee/powernse/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "pre-commit>=4.6",
    "pytest>=8.3",
    "shipgate>=0.1.11",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
filterwarnings = ["error"]

[tool.ruff.lint.per-file-ignores]
"src/powernse/__init__.py" = ["F401"]

[tool.deptry]
known_first_party = ["powernse"]
# tests/ import the package under test; that is not a dependency edge.
extend_exclude = ["tests"]

[tool.codespell]
# "fo" == F&O (futures & options) in NSE prose, not a misspelling of "of".
ignore-words-list = "fo"

# PowerNSE ShipGate policy — https://inquilabee.github.io/shipgate/
# suite: standard = ruff.lint + ty.check. Escalate with:
#   shipgate check --suite full --full-tree
# Make / CI / pre-commit always pass --full-tree. Bare `shipgate check`
# honors changed-only below and may shrink the gate.
# Ruff settings live in pyproject.toml [tool.ruff] (configs.mode: auto).
suite: standard
env: managed
target: .
changed-only: true
error-format: github
configs:
  mode: auto
checks:
  ty.check:
    scope: ty-src
scopes:
  python-src:
    target: src
  ty-src:
    target: src
  python-test-src:
    target: tests

gate.module-size:
  executable: python
  module: shipgate.policy.module_size
  modes:
    - check
  normalizer: gate_json
  configuration:
    bundled: configs/gates/module-size.yaml
    discover:
      - .shipgate/configs/gates/gate.module-size.yaml
    precedence:
      - repo
      - bundled
  option_order: []
  scope:
    extensions:
      - .py
    delivery: files

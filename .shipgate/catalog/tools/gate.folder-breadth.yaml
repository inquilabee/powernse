gate.folder-breadth:
  executable: python
  module: shipgate.policy.folder_breadth
  modes:
    - check
  normalizer: gate_json
  configuration:
    bundled: configs/gates/folder-breadth.yaml
    discover:
      - .shipgate/configs/gates/gate.folder-breadth.yaml
    precedence:
      - repo
      - bundled
  option_order: []
  scope:
    extensions:
      - .py
      - .md
      - .yaml
      - .sh
    delivery: dirs

gate.repeated-strings:
  executable: python
  module: shipgate.policy.repeated_strings
  modes:
    - check
  normalizer: gate_json
  configuration:
    bundled: configs/gates/repeated-strings.yaml
    discover:
      - .shipgate/configs/gates/gate.repeated-strings.yaml
    precedence:
      - repo
      - bundled
  option_order: []
  scope:
    extensions:
      - .py
    delivery: files

gate.test-only-symbols:
  executable: python
  module: shipgate.policy.test_only_symbols
  modes:
    - check
  normalizer: gate_json
  configuration:
    bundled: configs/gates/test-only-symbols.yaml
    discover:
      - .shipgate/configs/gates/gate.test-only-symbols.yaml
    precedence:
      - repo
      - bundled
  option_order: []
  scope:
    extensions:
      - .py
    delivery: files

extends: default
rules:
  line-length:
    max: 140  # workflow run: blocks carry long shell one-liners
  document-start: disable
  truthy:
    check-keys: false
  trailing-spaces: enable
  key-duplicates: enable
  indentation:
    spaces: 2
  # GitHub Actions workflows have their own quoting conventions (e.g. "3.13"
  # must stay quoted to not parse as a float); don't lint YAML quoting style.
  quoted-strings: disable

# Documented acronyms used in ShipGate prose (keys are allowlisted tokens).
UI: user interface
UX: user experience
JSCPD: copy-paste detector tool
SARIF: Static Analysis Results Interchange Format
PR: pull request

# PowerNSE domain terms
NSE: National Stock Exchange of India
BSE: Bombay Stock Exchange (Indian equity exchange, cross-check CA source)
OTM: out of the money (option/rights strike above market)
ETF: exchange-traded fund
NIFTYBEES: Nippon India ETF Nifty BeES (a traded symbol, used as an example)
BANKBEES: Nippon India ETF Nifty Bank BeES (a traded symbol, used as an example)
GOLDBEES: Nippon India ETF Gold BeES (a traded symbol, used as an example)
XBOM: exchange_calendars code for the NSE/BSE equity trading calendar
OHLC: open / high / low / close
OHLCV: open / high / low / close / volume
CM: cash market (NSE segment)
CA: corporate action
EQ: NSE's "EQ" series code for regular equity shares (vs. other series like BE, SM)
FO: futures and options (F&O)
UDIFF: NSE's unified daily bhavcopy file format
ISIN: International Securities Identification Number
OIDC: OpenID Connect (Trusted Publisher auth)
MIT: the MIT open-source license
CHANGELOG: the CHANGELOG.md file
DISCLAIMER: the DISCLAIMER.md file
LICENSE: the LICENSE file

site_name: PowerNSE
site_url: https://inquilabee.github.io/powernse/
site_description: Download NSE India end-of-day equity archives via CLI and Python.
repo_url: https://github.com/inquilabee/powernse
repo_name: inquilabee/powernse
edit_uri: edit/main/docs/
copyright: Copyright &copy; Vishal Mishra — MIT

theme:
  name: material
  logo: images/powernse-mark.svg
  favicon: images/powernse-mark.svg
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Install: user/install.md
  - Quickstart: user/quickstart.md
  - Download: user/download/archives.md
  - Python API: user/python/nsedata.md
  - GitHub bundle: user/bundle/fetch-bundle.md
  - Disclaimer: user/disclaimer.md
  - Changelog: https://github.com/inquilabee/powernse/blob/main/CHANGELOG.md
  - Maintainer:
      - Development: maintainer/development.md
      - Publish: maintainer/publish.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search

exclude_docs: |
  product/

validation:
  unrecognized_links: warn

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/inquilabee/powernse
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/powernse/

name: Refresh nse-data

on:
  schedule:
    # Sundays 06:00 UTC
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync package
        run: uv sync

      - name: Resume archive downloads
        run: |
          set -euo pipefail
          # Interactive CLI soft-fails missing days (exit 0); automation must use --strict
          # so a failed series fails this job instead of committing a partial refresh.
          ROOT=./nse-data
          DAYS=14
          FAILED=0
          run_one() {
            local label=$1
            shift
            if "$@"; then
              echo "OK: $label"
            else
              echo "FAIL: $label" >&2
              FAILED=1
            fi
          }
          run_one bhavcopy uv run powernse bhavcopy --resume --days "$DAYS" --root "$ROOT" --sleep 0.2 --strict
          run_one fo-bhavcopy uv run powernse fo-bhavcopy --resume --days "$DAYS" --root "$ROOT" --sleep 0.2 --strict
          run_one index-closes uv run powernse index-closes --resume --days "$DAYS" --root "$ROOT" --sleep 0.2 --strict
          # --resume only walks forward; --backfill fills any gap before the earliest staged
          # index-closes file (down to 2012-02-21). Idempotent once the history is staged: it exits 0
          # with "nothing to backfill", otherwise --skip-existing stats the files and downloads nothing.
          run_one index-closes-backfill uv run powernse index-closes --backfill --root "$ROOT" --sleep 0.2 --strict
          run_one full-bhavcopy uv run powernse full-bhavcopy --resume --days "$DAYS" --root "$ROOT" --sleep 0.2 --strict
          TODAY=$(date -u +%F)
          FROM=$(date -u -d "$TODAY - $DAYS days" +%F)
          run_one corporate-actions uv run powernse corporate-actions --from "$FROM" --to "$TODAY" --root "$ROOT" --sleep 0.2 --strict
          run_one index-constituents uv run powernse index-constituents --date "$TODAY" --root "$ROOT" --sleep 0.2 --strict
          run_one bulk-deals uv run powernse bulk-deals --date "$TODAY" --root "$ROOT" --sleep 0.2 --strict
          run_one block-deals uv run powernse block-deals --date "$TODAY" --root "$ROOT" --sleep 0.2 --strict
          run_one fo-secban uv run powernse fo-secban --date "$TODAY" --root "$ROOT" --sleep 0.2 --strict
          if [ "$FAILED" -ne 0 ]; then
            echo "One or more download series failed" >&2
            exit 1
          fi

      - name: Commit nse-data updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nse-data
          if git diff --staged --quiet; then
            echo "No nse-data changes"
            exit 0
          fi
          git commit -m "Refresh nse-data archive (Sunday)"
          git push

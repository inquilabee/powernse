name: Refresh nse-data

on:
  schedule:
    # Sundays 06:00 UTC
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync package
        run: uv sync

      - name: Resume archive downloads
        run: |
          set -euo pipefail
          ROOT=./nse-data
          DAYS=14
          uv run powernse bhavcopy --resume --days "$DAYS" --root "$ROOT" --sleep 0.2 || true
          uv run powernse fo-bhavcopy --resume --days "$DAYS" --root "$ROOT" --sleep 0.2 || true
          uv run powernse index-closes --resume --days "$DAYS" --root "$ROOT" --sleep 0.2 || true
          uv run powernse full-bhavcopy --resume --days "$DAYS" --root "$ROOT" --sleep 0.2 || true
          TODAY=$(date -u +%F)
          uv run powernse bulk-deals --date "$TODAY" --root "$ROOT" --sleep 0.2 || true
          uv run powernse block-deals --date "$TODAY" --root "$ROOT" --sleep 0.2 || true
          uv run powernse fo-secban --date "$TODAY" --root "$ROOT" --sleep 0.2 || true

      - name: Commit nse-data updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nse-data
          if git diff --staged --quiet; then
            echo "No nse-data changes"
            exit 0
          fi
          git commit -m "Refresh nse-data archive (Sunday)"
          git push

name: Publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Sync
        run: uv sync --frozen
      - name: Quality
        run: make check
      - name: Test
        run: make test
      - name: Build
        run: uv build
      - name: Smoke wheel
        run: |
          uv run --isolated --no-project --with dist/*.whl python -c \
            "import powernse; from powernse import NSEData; assert powernse.__version__; print(powernse.__version__)"
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/powernse
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: astral-sh/setup-uv@v5
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

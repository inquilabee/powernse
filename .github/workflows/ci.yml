name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Sync
        run: uv sync
      - name: Ruff
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Pytest
        run: uv run pytest
      - name: Build
        run: uv build

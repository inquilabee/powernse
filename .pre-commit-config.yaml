# ShipGate: format + fast `standard` check on commit; the full suite and pytest
# run on pre-push so `git commit` stays fast. The full suite is sequential
# (parallel OOMs) and takes minutes -- not something to pay on every commit.
repos:
  - repo: local
    hooks:
      - id: shipgate-sync
        name: uv sync
        entry: uv sync
        language: system
        pass_filenames: false
        always_run: true
      - id: shipgate-install
        name: shipgate install
        entry: uv run shipgate install
        language: system
        pass_filenames: false
        always_run: true
      - id: shipgate-format
        name: shipgate format
        entry: uv run shipgate format --target .
        language: system
        pass_filenames: false
        always_run: true
      - id: shipgate-check
        name: shipgate check (standard)
        entry: uv run shipgate check --target . --full-tree --suite standard
        language: system
        pass_filenames: false
        always_run: true
      - id: shipgate-check-full
        name: shipgate check (full)
        entry: uv run shipgate check --target . --full-tree
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        stages: [pre-push]
